<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.S Insaf General Store</title>

<meta name="description" content="B.S Insaf General Store - Grocery Store">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f7f5;
    color:#222;
}

/* ================= HEADER / SHOP BACKGROUND ================= */

header{
    position:relative;
    min-height:260px;
    color:white;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    /* SHOP BACKGROUND PICTURE */
    background-image:
        linear-gradient(
            rgba(0,63,50,.65),
            rgba(0,63,50,.70)
        ),
        url("https://images.unsplash.com/photo-1604719312566-8912e9c8a213?auto=format&fit=crop&w=1400&q=85");

    background-size:cover;
    background-position:center;
}

.header-content{
    position:relative;
    z-index:2;
    padding:25px 15px;
}

header h1{
    font-size:32px;
    margin-bottom:8px;
    text-shadow:0 2px 5px rgba(0,0,0,.5);
}

header p{
    font-size:16px;
    text-shadow:0 2px 4px rgba(0,0,0,.5);
}

.shop-badge{
    display:inline-block;
    margin-bottom:12px;
    background:white;
    color:#006b55;
    padding:8px 15px;
    border-radius:25px;
    font-weight:bold;
}

/* ================= MAIN ================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* ================= SEARCH ================= */

.search-box{
    margin:15px 0;
}

.search-box input{
    width:100%;
    padding:14px;
    border:2px solid #006b55;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:white;
}

.search-box input:focus{
    box-shadow:0 0 0 3px rgba(0,107,85,.15);
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
}

.category-btn{
    border:none;
    background:#ddd;
    padding:10px 15px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
    font-weight:bold;
}

.category-btn.active{
    background:#006b55;
    color:white;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:15px;
    margin-top:10px;
}

.product{
    background:white;
    border-radius:14px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
    text-align:center;
}

.product-image{
    width:100%;
    height:130px;
    border-radius:10px;
    background:#e8f3ef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
    margin-bottom:10px;
    overflow:hidden;
}

.product h3{
    font-size:17px;
    margin-bottom:6px;
}

.price{
    color:#006b55;
    font-weight:bold;
    font-size:18px;
    margin-bottom:10px;
}

/* ================= QUANTITY ================= */

.quantity{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:8px 0;
}

.qty-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#006b55;
    color:white;
    font-size:25px;
    font-weight:bold;
    cursor:pointer;
}

.qty-btn:active{
    transform:scale(.92);
}

.qty-number{
    min-width:35px;
    font-size:18px;
    font-weight:bold;
}

.add-btn{
    width:100%;
    border:none;
    padding:10px;
    border-radius:8px;
    background:#ff9800;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:active{
    transform:scale(.98);
}

/* ================= CART ================= */

.cart{
    background:white;
    margin-top:25px;
    padding:18px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.cart h2{
    color:#003f32;
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.cart-name{
    flex:1;
    font-weight:bold;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:6px;
}

.small-btn{
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:#006b55;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.cart-total{
    text-align:right;
    font-size:22px;
    font-weight:bold;
    color:#003f32;
    padding:15px 0;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

/* ================= CUSTOMER FORM ================= */

.customer-form{
    margin-top:15px;
}

.customer-form input,
.customer-form textarea{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #bbb;
    border-radius:8px;
    font-size:15px;
}

.customer-form textarea{
    min-height:90px;
    resize:vertical;
}

.order-btn{
    width:100%;
    background:#25D366;
    color:white;
    border:none;
    padding:14px;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.clear-btn{
    width:100%;
    margin-top:10px;
    background:#d32f2f;
    color:white;
    border:none;
    padding:12px;
    border-radius:9px;
    font-size:16px;
    cursor:pointer;
}

/* ================= NO RESULT ================= */

.no-result{
    text-align:center;
    padding:30px;
    display:none;
}

/* ================= FOOTER ================= */

footer{
    margin-top:30px;
    background:#003f32;
    color:white;
    text-align:center;
    padding:20px;
    font-size:14px;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    header{
        min-height:230px;
    }

    header h1{
        font-size:25px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product{
        padding:9px;
    }

    .product-image{
        height:110px;
        font-size:55px;
    }

    .product h3{
        font-size:15px;
    }

    .price{
        font-size:16px;
    }

}

/* ================= SMALL PHONE ================= */

@media(max-width:350px){

    .products{
        grid-template-columns:1fr 1fr;
    }

    .qty-btn{
        width:34px;
        height:34px;
        font-size:21px;
    }

}
</style>
</head>

<body>

<!-- ================= SHOP HEADER ================= -->

<header>

    <div class="header-content">

        <div class="shop-badge">
            🛒 Grocery Store
        </div>

        <h1>B.S Insaf General Store</h1>

        <p>
            Grocery • Daily Needs • Home Delivery
        </p>

    </div>

</header>


<div class="container">

<!-- ================= SEARCH ================= -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search saman..."
        oninput="renderProducts()"
    >

</div>


<!-- ================= CATEGORIES ================= -->

<div
    class="categories"
    id="categories">
</div>


<!-- ================= PRODUCTS ================= -->

<div
    class="products"
    id="products">
</div>


<div
    class="no-result"
    id="noResult">

    <h3>Saman nahi mila</h3>

</div>


<!-- ================= CART ================= -->

<div class="cart">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <div class="cart-total">

        Total:
        <span id="cartTotal">
            Rs. 0
        </span>

    </div>


    <!-- ================= CUSTOMER ================= -->

    <div class="customer-form">

        <input
            type="text"
            id="customerName"
            placeholder="Customer Name"
        >

        <input
            type="tel"
            id="customerPhone"
            placeholder="Phone Number"
        >

        <textarea
            id="customerAddress"
            placeholder="Customer Address"
        ></textarea>


        <button
            class="order-btn"
            onclick="orderWhatsApp()">

            📲 Order on WhatsApp

        </button>


        <button
            class="clear-btn"
            onclick="clearCart()">

            🗑 Clear Cart

        </button>

    </div>

</div>

</div>


<footer>

    © 2026 B.S Insaf General Store

</footer>


<script>

/* =====================================================
   WHATSAPP NUMBER
   =====================================================

   Yahan apna asli WhatsApp number likhein.

   Pakistan example:
   923001234567

   + sign nahi lagana.
*/

const SHOP_WHATSAPP = "923001234567";


/* =====================================================
   PRODUCTS
   =====================================================

   PRICE YAHAN SE CHANGE KARNA HAI.

   price: 50  = Rs. 50
   price: 150 = Rs. 150

   IMPORTANT:
   Yahan 100 se divide nahi hota.
*/

const products = [

    {
        id:1,
        name:"Sugar",
        price:50,
        category:"Grocery",
        emoji:"🍚"
    },

    {
        id:2,
        name:"Rice",
        price:200,
        category:"Grocery",
        emoji:"🍚"
    },

    {
        id:3,
        name:"Flour",
        price:150,
        category:"Grocery",
        emoji:"🌾"
    },

    {
        id:4,
        name:"Cooking Oil",
        price:550,
        category:"Grocery",
        emoji:"🫗"
    },

    {
        id:5,
        name:"Tea",
        price:300,
        category:"Grocery",
        emoji:"🍵"
    },

    {
        id:6,
        name:"Salt",
        price:50,
        category:"Grocery",
        emoji:"🧂"
    },

    {
        id:7,
        name:"Lentils",
        price:250,
        category:"Grocery",
        emoji:"🥣"
    },

    {
        id:8,
        name:"Milk",
        price:200,
        category:"Dairy",
        emoji:"🥛"
    },

    {
        id:9,
        name:"Bread",
        price:120,
        category:"Bakery",
        emoji:"🍞"
    },

    {
        id:10,
        name:"Eggs",
        price:300,
        category:"Dairy",
        emoji:"🥚"
    },

    {
        id:11,
        name:"Biscuits",
        price:80,
        category:"Snacks",
        emoji:"🍪"
    },

    {
        id:12,
        name:"Chips",
        price:100,
        category:"Snacks",
        emoji:"🍟"
    },

    {
        id:13,
        name:"Soap",
        price:120,
        category:"Household",
        emoji:"🧼"
    },

    {
        id:14,
        name:"Shampoo",
        price:250,
        category:"Personal Care",
        emoji:"🧴"
    },

    {
        id:15,
        name:"Toothpaste",
        price:180,
        category:"Personal Care",
        emoji:"🪥"
    },

    {
        id:16,
        name:"Detergent",
        price:300,
        category:"Household",
        emoji:"🧺"
    },

    {
        id:17,
        name:"Cold Drink",
        price:150,
        category:"Drinks",
        emoji:"🥤"
    },

    {
        id:18,
        name:"Water Bottle",
        price:80,
        category:"Drinks",
        emoji:"💧"
    }

];


/* =====================================================
   CART
   ===================================================== */

let cart = {};

let selectedCategory = "All";


/* =====================================================
   PRICE
   ===================================================== */

function formatPrice(price){

    return "Rs. " +
        Number(price).toLocaleString("en-PK",{
            maximumFractionDigits:0
        });

}


/* =====================================================
   CATEGORIES
   ===================================================== */

function renderCategories(){

    const categoriesDiv =
        document.getElementById("categories");

    const categories = [
        "All",
        ...new Set(
            products.map(
                product => product.category
            )
        )
    ];

    categoriesDiv.innerHTML = "";

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category-btn " +
            (
                selectedCategory === category
                ? "active"
                : ""
            );

        button.textContent = category;

        button.onclick = function(){

            selectedCategory = category;

            renderCategories();

            renderProducts();

        };

        categoriesDiv.appendChild(button);

    });

}


/* =====================================================
   PRODUCTS
   ===================================================== */

function renderProducts(){

    const productsDiv =
        document.getElementById("products");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    productsDiv.innerHTML = "";

    let found = 0;

    products.forEach(product => {

        const matchesSearch =
            product.name
            .toLowerCase()
            .includes(search);

        const matchesCategory =
            selectedCategory === "All" ||
            product.category === selectedCategory;

        if(
            !matchesSearch ||
            !matchesCategory
        ){
            return;
        }

        found++;

        const qty =
            cart[product.id] || 0;

        const card =
            document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <div class="product-image">
                ${product.emoji}
            </div>

            <h3>
                ${product.name}
            </h3>

            <div class="price">
                ${formatPrice(product.price)}
            </div>

            <div class="quantity">

                <button
                    class="qty-btn"
                    onclick="changeQty(${product.id},-1)">
                    −
                </button>

                <span class="qty-number">
                    ${qty}
                </span>

                <button
                    class="qty-btn"
                    onclick="changeQty(${product.id},1)">
                    +
                </button>

            </div>

            <button
                class="add-btn"
                onclick="addToCart(${product.id})">

                Add to Cart

            </button>
        `;

        productsDiv.appendChild(card);

    });

    document.getElementById("noResult").style.display =
        found === 0
        ? "block"
        : "none";

}


/* =====================================================
   ADD TO CART
   ===================================================== */

function addToCart(id){

    if(!cart[id]){
        cart[id] = 0;
    }

    cart[id]++;

    renderProducts();

    renderCart();

}


/* =====================================================
   PLUS / MINUS
   ===================================================== */

function changeQty(id,amount){

    if(!cart[id]){
        cart[id] = 0;
    }

    cart[id] += amount;

    if(cart[id] <= 0){

        delete cart[id];

    }

    renderProducts();

    renderCart();

}


/* =====================================================
   CART
   ===================================================== */

function renderCart(){

    const cartItems =
        document.getElementById("cartItems");

    cartItems.innerHTML = "";

    const ids =
        Object.keys(cart);

    if(ids.length === 0){

        cartItems.innerHTML =
            '<div class="empty">Cart is empty</div>';

        document.getElementById("cartTotal")
            .textContent = "Rs. 0";

        return;
    }

    let total = 0;

    ids.forEach(id => {

        const product =
            products.find(
                p => p.id == id
            );

        if(!product){
            return;
        }

        const qty =
            cart[id];

        const itemTotal =
            product.price * qty;

        total += itemTotal;

        const item =
            document.createElement("div");

        item.className =
            "cart-item";

        item.innerHTML = `

            <div class="cart-name">

                ${product.name}

                <br>

                <small>
                    ${formatPrice(product.price)}
                    × ${qty}
                </small>

            </div>


            <div class="cart-controls">

                <button
                    class="small-btn"
                    onclick="changeQty(${product.id},-1)">
                    −
                </button>

                <strong>
                    ${qty}
                </strong>

                <button
                    class="small-btn"
                    onclick="changeQty(${product.id},1)">
                    +
                </button>

            </div>


            <strong>
                ${formatPrice(itemTotal)}
            </strong>

        `;

        cartItems.appendChild(item);

    });

    document.getElementById("cartTotal")
        .textContent =
        formatPrice(total);

}


/* =====================================================
   WHATSAPP ORDER
   ===================================================== */

function orderWhatsApp(){

    const ids =
        Object.keys(cart);

    if(ids.length === 0){

        alert(
            "Please add saman to cart first."
        );

        return;
    }


    if(
        !SHOP_WHATSAPP ||
        SHOP_WHATSAPP.includes("X")
    ){

        alert(
            "HTML mein apna WhatsApp number likhein."
        );

        return;
    }


    const name =
        document
        .getElementById("customerName")
        .value
        .trim();

    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();

    const address =
        document
        .getElementById("customerAddress")
        .value
        .trim();


    if(!name){

        alert(
            "Customer name likhein."
        );

        return;
    }


    if(!phone){

        alert(
            "Phone number likhein."
        );

        return;
    }


    if(!address){

        alert(
            "Customer address likhein."
        );

        return;
    }


    let message =
        "🛒 B.S Insaf General Store Order\n\n";


    message +=
        "Customer Name: " +
        name +
        "\n";


    message +=
        "Phone: " +
        phone +
        "\n";


    message +=
        "Address: " +
        address +
        "\n\n";


    message +=
        "Order Details:\n";


    let total = 0;


    ids.forEach(id => {

        const product =
            products.find(
                p => p.id == id
            );

        if(!product){
            return;
        }

        const qty =
            cart[id];

        const itemTotal =
            product.price * qty;

        total += itemTotal;


        message +=
            product.name +
            " × " +
            qty +
            " = " +
            formatPrice(itemTotal) +
            "\n";

    });


    message +=
        "\nTOTAL = " +
        formatPrice(total);


    const url =
        "https://wa.me/" +
        SHOP_WHATSAPP +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   CLEAR CART
   ===================================================== */

function clearCart(){

    if(
        Object.keys(cart).length === 0
    ){
        return;
    }


    if(
        confirm(
            "Cart clear karna hai?"
        )
    ){

        cart = {};

        renderProducts();

        renderCart();

    }

}


/* =====================================================
   START
   ===================================================== */

renderCategories();

renderProducts();

renderCart();

</script>

</body>
</html>
