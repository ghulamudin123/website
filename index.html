<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.S Insaf General Store</title>

<meta name="description"
content="B.S Insaf General Store - Grocery Store">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f7f5;
    color:#222;
}

/* ================= BACKGROUND BUTTON ================= */

.background-tools{
    background:white;
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.bg-button{
    display:inline-block;
    background:#006b55;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    margin:3px;
}

.remove-bg{
    background:#d32f2f;
}

#backgroundInput{
    display:none;
}

/* ================= HEADER ================= */

header{

    min-height:250px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:white;

    background:
    linear-gradient(
        rgba(0,63,50,.55),
        rgba(0,63,50,.65)
    ),
    url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1400&q=85");

    background-size:cover;
    background-position:center;

    transition:.3s;
}

.header-content{
    padding:30px 15px;
}

.shop-badge{
    display:inline-block;
    background:white;
    color:#006b55;
    padding:8px 16px;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:12px;
}

header h1{
    font-size:31px;
    margin-bottom:8px;
    text-shadow:0 2px 5px #000;
}

header p{
    font-size:16px;
    text-shadow:0 2px 4px #000;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* ================= SEARCH ================= */

.search-box{
    margin:15px 0;
}

.search-box input{
    width:100%;
    padding:14px;
    border:2px solid #006b55;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
}

.category-btn{
    border:none;
    background:#ddd;
    padding:10px 15px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
    font-weight:bold;
}

.category-btn.active{
    background:#006b55;
    color:white;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(170px,1fr));

    gap:15px;
}

.product{
    background:white;
    border-radius:14px;
    padding:10px;

    box-shadow:
    0 2px 8px rgba(0,0,0,.12);

    text-align:center;
}

/* PRODUCT IMAGE */

.product-image{
    width:100%;
    height:140px;

    border-radius:10px;

    overflow:hidden;

    background:#e8f3ef;

    margin-bottom:10px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product h3{
    font-size:17px;
    margin-bottom:6px;
}

.price{
    color:#006b55;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

/* ================= PLUS MINUS ================= */

.quantity{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    margin:8px 0;
}

.qty-btn{

    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    background:#006b55;
    color:white;

    font-size:25px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.qty-btn:active{
    transform:scale(.9);
}

.qty-number{
    min-width:35px;
    font-size:19px;
    font-weight:bold;
}

/* ================= ADD BUTTON ================= */

.add-btn{

    width:100%;

    border:none;

    padding:11px;

    border-radius:8px;

    background:#ff9800;

    color:white;

    font-weight:bold;

    font-size:15px;

    cursor:pointer;
}

/* ================= CART ================= */

.cart{

    background:white;

    margin-top:25px;

    padding:18px;

    border-radius:15px;

    box-shadow:
    0 2px 10px rgba(0,0,0,.12);
}

.cart h2{
    color:#003f32;
    margin-bottom:15px;
}

.cart-item{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    padding:12px 0;

    border-bottom:1px solid #ddd;
}

.cart-name{
    flex:1;
    font-weight:bold;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:6px;
}

.small-btn{

    width:32px;
    height:32px;

    border:none;

    border-radius:50%;

    background:#006b55;

    color:white;

    font-size:20px;

    cursor:pointer;
}

.cart-total{

    text-align:right;

    font-size:22px;

    font-weight:bold;

    color:#003f32;

    padding:15px 0;
}

.empty{

    text-align:center;

    padding:20px;

    color:#777;
}

/* ================= CUSTOMER FORM ================= */

.customer-form{
    margin-top:15px;
}

.customer-form input,
.customer-form textarea{

    width:100%;

    padding:13px;

    margin-bottom:10px;

    border:1px solid #bbb;

    border-radius:8px;

    font-size:15px;
}

.customer-form textarea{
    min-height:90px;
    resize:vertical;
}

/* ================= WHATSAPP ================= */

.order-btn{

    width:100%;

    background:#25D366;

    color:white;

    border:none;

    padding:14px;

    border-radius:9px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

/* ================= CLEAR ================= */

.clear-btn{

    width:100%;

    margin-top:10px;

    background:#d32f2f;

    color:white;

    border:none;

    padding:12px;

    border-radius:9px;

    font-size:16px;

    cursor:pointer;
}

/* ================= NO RESULT ================= */

.no-result{

    text-align:center;

    padding:30px;

    display:none;
}

/* ================= FOOTER ================= */

footer{

    margin-top:30px;

    background:#003f32;

    color:white;

    text-align:center;

    padding:20px;

}

/* ================= MOBILE ================= */

@media(max-width:500px){

    header{
        min-height:220px;
    }

    header h1{
        font-size:25px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product{
        padding:8px;
    }

    .product-image{
        height:105px;
    }

    .product h3{
        font-size:15px;
    }

    .price{
        font-size:16px;
    }

    .qty-btn{
        width:36px;
        height:36px;
        font-size:22px;
    }

}

</style>
</head>

</div>

</div>


<footer>

    © 2026 B.S Insaf General Store

</footer>

/* =================================================
   CART
================================================= */

let cart = {};

let selectedCategory = "All";


/* =================================================
   DEFAULT BACKGROUND
================================================= */

const defaultBackground =
`linear-gradient(
    rgba(0,63,50,.55),
    rgba(0,63,50,.65)
),
url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1400&q=85")`;


/* =================================================
   CHANGE BACKGROUND
================================================= */

document
.getElementById("backgroundInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file){
            return;
        }

        if(!file.type.startsWith("image/")){

            alert(
                "Please select an image."
            );

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const image =
                    e.target.result;


                const header =
                    document.getElementById(
                        "shopHeader"
                    );


                header.style.backgroundImage =
                    "linear-gradient(" +
                    "rgba(0,63,50,.45)," +
                    "rgba(0,63,50,.60)" +
                    ")," +
                    "url('" +
                    image +
                    "')";


                try{

                    localStorage.setItem(
                        "BSInsafBackground",
                        image
                    );

                }catch(error){

                    alert(
                        "Image bohat bari hai. " +
                        "Choti image select karein."
                    );

                }

            };


        reader.readAsDataURL(file);

    }
);


/* =================================================
   LOAD SAVED BACKGROUND
================================================= */

const savedBackground =
    localStorage.getItem(
        "BSInsafBackground"
    );


if(savedBackground){

    document.getElementById(
        "shopHeader"
    ).style.backgroundImage =
        "linear-gradient(" +
        "rgba(0,63,50,.45)," +
        "rgba(0,63,50,.60)" +
        ")," +
        "url('" +
        savedBackground +
        "')";

}


/* =================================================
   REMOVE BACKGROUND
================================================= */

function removeBackground(){

    localStorage.removeItem(
        "BSInsafBackground"
    );


    document.getElementById(
        "shopHeader"
    ).style.backgroundImage =
        defaultBackground;

}


/* =================================================
   PRICE FORMAT
================================================= */

function formatPrice(price){

    return "Rs. " +
    Number(price).toLocaleString(
        "en-PK",
        {
            maximumFractionDigits:0
        }
    );

}


/* =================================================
   CATEGORIES
================================================= */

function renderCategories(){

    const div =
        document.getElementById(
            "categories"
        );


    const categories = [
        "All",
        ...new Set(
            products.map(
                p => p.category
            )
        )
    ];


    div.innerHTML = "";


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn " +
                (
                    selectedCategory ===
                    category
                    ? "active"
                    : ""
                );


            button.textContent =
                category;


            button.onclick =
                function(){

                    selectedCategory =
                        category;

                    renderCategories();

                    renderProducts();

                };


            div.appendChild(button);

        }
    );

}


/* =================================================
   RENDER PRODUCTS
================================================= */

function renderProducts(){

    const div =
        document.getElementById(
            "products"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    div.innerHTML = "";


    let found = 0;


    products.forEach(
        product => {

            const searchMatch =
                product.name
                .toLowerCase()
                .includes(search);


            const categoryMatch =
                selectedCategory === "All" ||
                product.category ===
                selectedCategory;


            if(
                !searchMatch ||
                !categoryMatch
            ){
                return;
            }


            found++;


            const qty =
                cart[product.id] || 0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product";


            card.innerHTML = `

                <div class="product-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        loading="lazy"
                        onerror="
                        this.style.display='none';
                        this.parentElement.innerHTML='🛒';
                        ">

                </div>

                <h3>
                    ${product.name}
                </h3>

                <div class="price">
                    ${formatPrice(product.price)}
                </div>

                <div class="quantity">

                    <button
                        class="qty-btn"
                        onclick="
                        changeQty(
                            ${product.id},
                            -1
                        )">

                        −

                    </button>

                    <span
                        class="qty-number">

                        ${qty}

                    </span>

                    <button
                        class="qty-btn"
                        onclick="
                        changeQty(
                            ${product.id},
                            1
                        )">

                        +

                    </button>

                </div>

                <button
                    class="add-btn"
                    onclick="
                    addToCart(
                        ${product.id}
                    )">

                    Add to Cart

                </button>

            `;


            div.appendChild(card);

        }
    );


    document.getElementById(
        "noResult"
    ).style.display =
        found === 0
        ? "block"
        : "none";

}


/* =================================================
   ADD TO CART
================================================= */

function addToCart(id){

    if(!cart[id]){

        cart[id] = 0;

    }


    cart[id]++;


    renderProducts();

    renderCart();

}


/* =================================================
   PLUS MINUS
================================================= */

function changeQty(
    id,
    amount
){

    if(!cart[id]){

        cart[id] = 0;

    }


    cart[id] += amount;


    if(cart[id] <= 0){

        delete cart[id];

    }


    renderProducts();

    renderCart();

}


/* =================================================
   RENDER CART
================================================= */

function renderCart(){

    const div =
        document.getElementById(
            "cartItems"
        );


    div.innerHTML = "";


    const ids =
        Object.keys(cart);


    if(ids.length === 0){

        div.innerHTML =
            `<div class="empty">
                Cart is empty
            </div>`;


        document.getElementById(
            "cartTotal"
        ).textContent =
            "Rs. 0";


        return;

    }


    let total = 0;


    ids.forEach(
        id => {

            const product =
                products.find(
                    p => p.id == id
                );


            if(!product){
                return;
            }


            const qty =
                cart[id];


            const itemTotal =
                product.price * qty;


            total += itemTotal;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "cart-item";


            item.innerHTML = `

                <div class="cart-name">

                    ${product.name}

                    <br>

                    <small>
                        ${formatPrice(
                            product.price
                        )}
                        × ${qty}
                    </small>

                </div>

                <div class="cart-controls">

                    <button
                        class="small-btn"
                        onclick="
                        changeQty(
                            ${product.id},
                            -1
                        )">

                        −

                    </button>

                    <strong>
                        ${qty}
                    </strong>

                    <button
                        class="small-btn"
                        onclick="
                        changeQty(
                            ${product.id},
                            1
                        )">

                        +

                    </button>

                </div>

                <strong>
                    ${formatPrice(
                        itemTotal
                    )}
                </strong>

            `;


            div.appendChild(item);

        }
    );


    document.getElementById(
        "cartTotal"
    ).textContent =
        formatPrice(total);

}


/* =================================================
   WHATSAPP ORDER
================================================= */

function orderWhatsApp(){

    const ids =
        Object.keys(cart);


    if(ids.length === 0){

        alert(
            "Please add saman to cart first."
        );

        return;

    }


    if(
        !SHOP_WHATSAPP ||
        SHOP_WHATSAPP.includes(
            "123456"
        )
    ){

        alert(
            "HTML mein apna WhatsApp number likhein."
        );

        return;

    }


    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const address =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    if(!name){

        alert(
            "Customer name likhein."
        );

        return;

    }


    if(!phone){

        alert(
            "Phone number likhein."
        );

        return;

    }


    if(!address){

        alert(
            "Customer address likhein."
        );

        return;

    }


    let message =
        "🛒 B.S Insaf General Store Order\n\n";


    message +=
        "Customer Name: " +
        name +
        "\n";


    message +=
        "Phone: " +
        phone +
        "\n";


    message +=
        "Address: " +
        address +
        "\n\n";


    message +=
        "Order Details:\n";


    let total = 0;


    ids.forEach(
        id => {

            const product =
                products.find(
                    p => p.id == id
                );


            if(!product){
                return;
            }


            const qty =
                cart[id];


            const itemTotal =
                product.price * qty;


            total += itemTotal;


            message +=
                product.name +
                " × " +
                qty +
                " = " +
                formatPrice(
                    itemTotal
                ) +
                "\n";

        }
    );


    message +=
        "\nTOTAL = " +
        formatPrice(total);


    const url =
        "https://wa.me/" +
        SHOP_WHATSAPP +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/* =================================================
   CLEAR CART
================================================= */

function clearCart(){

    if(
        Object.keys(cart).length === 0
    ){
        return;
    }


    if(
        confirm(
            "Cart clear karna hai?"
        )
    ){

        cart = {};

        renderProducts();

        renderCart();

    }

}


/* =================================================
   START
================================================= */

renderCategories();

renderProducts();

renderCart();

</script>
