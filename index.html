<head>
    <style>
*{
    box-sizing:border-box;
}

body{
margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#087f5b;
    color:white;
    text-align:center;
    padding:18px 10px;
    position:sticky;
    top:0;
    z-index:100;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.search-box{
    padding:12px;
    background:white;
    position:sticky;
    top:78px;
    z-index:90;
}

#search{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.section-title{
    text-align:center;
    margin:15px 0;
    font-size:22px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.category-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 10px #0002;
    cursor:pointer;
    transition:.2s;
}

.category-card:hover{
    transform:translateY(-3px);
}

.category-card img{
    width:100%;
    height:145px;
    object-fit:cover;
    display:block;
}

.category-name{
    text-align:center;
    padding:12px 5px;
    font-size:18px;
    font-weight:bold;
}

.products-section{
    display:none;
}

.back-btn{
    background:#555;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    margin-bottom:12px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.product{
    background:white;
    border-radius:13px;
    overflow:hidden;
    box-shadow:0 3px 10px #0002;
}

.product img{
    width:100%;
    height:130px;
    object-fit:cover;
}

.product-info{
    padding:10px;
}

.product-name{
    font-weight:bold;
    font-size:16px;
    min-height:38px;
}

.price{
    color:#087f5b;
    font-weight:bold;
    font-size:17px;
    margin:5px 0;
}

.qty{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:8px;
}

.qty button{
    width:35px;
    height:35px;
    border:0;
    border-radius:8px;
    background:#087f5b;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.qty span{
    font-size:18px;
    font-weight:bold;
    min-width:25px;
    text-align:center;
}

.cart{
    background:white;
    margin-top:20px;
    border-radius:15px;
    padding:15px;
    box-shadow:0 3px 10px #0002;
}

.cart h2{
    margin-top:0;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    padding:9px 0;
    gap:8px;
}

.total{
    font-size:21px;
    font-weight:bold;
    text-align:right;
    margin-top:12px;
    color:#087f5b;
}

.customer{
    margin-top:15px;
}

.customer input,
.customer textarea{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.customer textarea{
    height:80px;
    resize:none;
}

.order-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.clear-btn{
    width:100%;
    padding:11px;
    border:0;
    border-radius:10px;
    background:#dc3545;
    color:white;
    font-size:15px;
    cursor:pointer;
    margin-top:8px;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}
.cover{
    width:100%;
    display:block;
}

.shop-logo{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:20px auto;
}
@media(min-width:700px){
    .categories{
        grid-template-columns:repeat(4,1fr);
    }

    .products{
        grid-template-columns:repeat(4,1fr);
    }
    
}
</style>
</head>

<body>

    <img class="cover" src="cover.png" alt="B.S Insaf General Store">

<img class="shop-logo" src="logo.png" alt="B.S Insaf General Store Logo">
<header>
    <h1>🛒 B.S Insaf General Store</h1>
    <p>آپ کی روزمرہ ضرورت کی تمام اشیاء</p>
</header>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="🔍 سامان تلاش کریں..."
        oninput="searchProducts()"
    >
</div>

<div class="container">

    <!-- CATEGORIES -->
    <div id="categorySection">

        <h2 class="section-title">📦 Categories</h2>

        <div class="categories" id="categories"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="products-section" id="productsSection">

        <button class="back-btn" onclick="showCategories()">
            ← واپس Categories
        </button>

        <h2 class="section-title" id="categoryTitle"></h2>

        <div class="products" id="products"></div>

    </div>


    <!-- CART -->
    <div class="cart">

        <h2>🛒 آپ کا Cart</h2>

        <div id="cartItems">
            <div class="empty">ابھی Cart خالی ہے</div>
        </div>

        <div class="total">
            Total: Rs. <span id="total">0</span>
        </div>

        <div class="customer">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

            <input
                type="tel"
                id="customerPhone"
                placeholder="Phone Number"
            >

            <textarea
                id="customerAddress"
                placeholder="Customer Address"
            ></textarea>

            <button class="order-btn" onclick="sendWhatsApp()">
                📱 WhatsApp پر Order بھیجیں
            </button>

            <button class="clear-btn" onclick="clearCart()">
                🗑️ Cart صاف کریں
            </button>

        </div>

    </div>

</div>


<script>

/*
====================================================
        یہاں سے آپ نیا سامان ADD کریں گے
====================================================

ہر category کے اندر جتنی مرضی چیزیں ڈال سکتے ہیں۔

name  = سامان کا نام
price = قیمت
image = تصویر کا URL

مثال:

{
    name:"نیا سامان",
    price:100,
    image:"https://..."
}

====================================================
*/


const PRODUCTS = {

    items: [
        {

        },
        {

            price: 1300,
            image: "tea.png"
        }
    ]
},


    "چینی": {

        image:
        "https://images.unsplash.com/photo-1581441363689-1f3c3c414635?auto=format&fit=crop&w=600&q=80",

        items:[

            {
                name:"چینی 1 کلو",
                price:180,
                image:"https://images.unsplash.com/photo-1581441363689-1f3c3c414635?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"چینی 2 کلو",
                price:360,
                image:"https://images.unsplash.com/photo-1581441363689-1f3c3c414635?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"چینی 5 کلو",
                price:900,
                image:"https://images.unsplash.com/photo-1581441363689-1f3c3c414635?auto=format&fit=crop&w=600&q=80"
            }

        ]
    },


    "چاول": {

        image:
        "https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?auto=format&fit=crop&w=600&q=80",

        items:[

            {
                name:"چاول 1 کلو",
                price:300,
                image:"https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"چاول 2 کلو",
                price:600,
                image:"https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"چاول 5 کلو",
                price:1500,
                image:"https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?auto=format&fit=crop&w=600&q=80"
            }

        ]

    "دالیں": {

            },

                price:400,

            },

            {

                price:320,
                image:"https://images.unsplash.com/photo-1515543904379-3d757afe72e3?auto=format&fit=crop&w=600&q=80"
            }

        ]
    },


    "بسکٹ": {

        image:
        "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80",

        items:[

            {
                name:"بسکٹ پیکٹ 20 روپے",
                price:20,
                image:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"بسکٹ پیکٹ 50 روپے",
                price:50,
                image:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"بسکٹ پیکٹ 100 روپے",
                price:100,
                image:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80"
            }

        ]
    },


    "صابن": {

        image:
        "https://images.unsplash.com/photo-1607006344380-b6775a0824c7?auto=format&fit=crop&w=600&q=80",

        items:[

            {
                name:"صابن 50 روپے",
                price:50,
                image:"https://images.unsplash.com/photo-1607006344380-b6775a0824c7?auto=format&fit=crop&w=600&q=80"
            },

            {
                name:"صابن 100 روپے",
                price:100,
                image:"https://images.unsplash.com/photo-1607006344380-b6775a0824c7?auto=format&fit=crop&w=600&q=80"
            }

        ]
    }

};


/*
====================================================
             باقی SYSTEM
====================================================
*/

let cart = {};

let currentCategory = "";


/* Categories دکھائیں */

function loadCategories(){

    const box = document.getElementById("categories");

    box.innerHTML = "";

    for(let category in PRODUCTS){

        const data = PRODUCTS[category];

        box.innerHTML += `

            <div class="category-card"
                 onclick="openCategory('${category}')">

                <img src="${data.image}"
                     onerror="this.style.display='none'">

                <div class="category-name">
                    ${category}
                </div>

            </div>

        `;
    }
}


/* Category کھولیں */

function openCategory(category){

    currentCategory = category;

    document.getElementById("categorySection").style.display="none";

    document.getElementById("productsSection").style.display="block";

    document.getElementById("categoryTitle").innerText =
        "🛍️ " + category;

    displayProducts(PRODUCTS[category].items);
}


/* Products دکھائیں */

function displayProducts(items){

    const box = document.getElementById("products");

    box.innerHTML="";

    if(items.length===0){

        box.innerHTML =
        '<div class="empty">کوئی سامان نہیں ملا</div>';

        return;
    }

    items.forEach((item,index)=>{

        const key = currentCategory + "_" + index;

        const quantity = cart[key] ? cart[key].quantity : 0;

        box.innerHTML += `

            <div class="product">

                <img src="${item.image}"
                     onerror="this.style.display='none'">

                <div class="product-info">

                    <div class="product-name">
                        ${item.name}
                    </div>

                    <div class="price">
                        Rs. ${item.price}
                    </div>

                    <div class="qty">

                        <button
                            onclick="changeQty('${currentCategory}',${index},-1)">
                            −
                        </button>

                        <span id="qty-${key}">
                            ${quantity}
                        </span>

                        <button
                            onclick="changeQty('${currentCategory}',${index},1)">
                            +
                        </button>

                    </div>

                </div>

            </div>

        `;
    });
}


/* Quantity */

function changeQty(category,index,change){

    const key = category + "_" + index;

    const item = PRODUCTS[category].items[index];

    if(!cart[key]){

        cart[key] = {
            name:item.name,
            price:item.price,
            quantity:0
        };

    }

    cart[key].quantity += change;

    if(cart[key].quantity <= 0){

        delete cart[key];

    }

    displayProducts(PRODUCTS[category].items);

    updateCart();
}


/* Cart */

function updateCart(){

    const box = document.getElementById("cartItems");

    let total = 0;

    box.innerHTML="";

    const keys = Object.keys(cart);

    if(keys.length===0){

        box.innerHTML =
        '<div class="empty">ابھی Cart خالی ہے</div>';

    }

    keys.forEach(key=>{

        const item = cart[key];

        const subtotal =
            item.price * item.quantity;

        total += subtotal;

        box.innerHTML += `

            <div class="cart-item">

                <span>
                    ${item.name}
                    × ${item.quantity}
                </span>

                <strong>
                    Rs. ${subtotal}
                </strong>

            </div>

        `;
    });

    document.getElementById("total").innerText = total;
}


/* واپس Categories */

function showCategories(){

    document.getElementById("productsSection").style.display="none";

    document.getElementById("categorySection").style.display="block";

    document.getElementById("search").value="";

    loadCategories();
}


/* Search */

function searchProducts(){

    const search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();

    if(search===""){

        showCategories();

        return;
    }

    document.getElementById("categorySection").style.display="none";

    document.getElementById("productsSection").style.display="block";

    document.getElementById("categoryTitle").innerText =
        "🔍 Search Result";

    let results=[];

    for(let category in PRODUCTS){

        PRODUCTS[category].items.forEach((item,index)=>{

            if(
                item.name.toLowerCase().includes(search) ||
                category.toLowerCase().includes(search)
            ){

                results.push({
                    item:item,
                    category:category,
                    index:index
                });

            }

        });

    }

    const box = document.getElementById("products");

    box.innerHTML="";

    results.forEach(result=>{

        const item=result.item;

        const key =
            result.category + "_" + result.index;

        const quantity =
            cart[key] ? cart[key].quantity : 0;

        box.innerHTML += `

            <div class="product">

                <img src="${item.image}">

                <div class="product-info">

                    <div class="product-name">
                        ${item.name}
                    </div>

                    <div class="price">
                        Rs. ${item.price}
                    </div>

                    <div class="qty">

                        <button
                        onclick="changeQty('${result.category}',${result.index},-1)">
                        −
                        </button>

                        <span>
                        ${quantity}
                        </span>

                        <button
                        onclick="changeQty('${result.category}',${result.index},1)">
                        +
                        </button>

                    </div>

                </div>

            </div>

        `;
    });

    if(results.length===0){

        box.innerHTML =
        '<div class="empty">کوئی سامان نہیں ملا</div>';

    }
}


/* Clear Cart */

function clearCart(){

    cart={};

    updateCart();

    if(currentCategory){

        displayProducts(
            PRODUCTS[currentCategory].items
        );

    }

}


/* WhatsApp Order */

function sendWhatsApp(){

    const keys=Object.keys(cart);

    if(keys.length===0){

        alert("پہلے Cart میں سامان شامل کریں۔");

        return;
    }

    const name =
        document.getElementById("customerName").value;

    const phone =
        document.getElementById("customerPhone").value;

    const address =
        document.getElementById("customerAddress").value;

    let message =
        "🛒 B.S Insaf General Store%0A%0A";

    message +=
        "Customer Name: " + name + "%0A";

    message +=
        "Phone: " + phone + "%0A";

    message +=
        "Address: " + address + "%0A%0A";

    message +=
        "📦 Order:%0A";

    let total=0;

    keys.forEach(key=>{

        const item=cart[key];

        const subtotal =
            item.price * item.quantity;

        total += subtotal;

        message +=
            "• " +
            item.name +
            " × " +
            item.quantity +
            " = Rs. " +
            subtotal +
            "%0A";

    });

    message +=
        "%0A💰 Total: Rs. " + total;

    /*
    ============================================
    IMPORTANT:
    نیچے 923XXXXXXXXX کی جگہ اپنا WhatsApp
    نمبر لکھیں۔

    مثال:
    923111263960
    ============================================
    */

    const shopWhatsApp =
        "923111263960";

    const url =
        "https://wa.me/" +
        shopWhatsApp +
        "?text=" +
        message;

    window.open(url,"_blank");
}


/* Start */

loadCategories();

updateCart();

</script>
