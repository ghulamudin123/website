<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.S Insaf General Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}

.hero{
    position:relative;
    height:250px;
    overflow:hidden;
    background:#087f5b;
}
.hero-cover{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.55));
}
.hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    padding:15px;
}
.shop-logo{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    box-shadow:0 3px 12px #0006;
    background:white;
}
.hero h1{margin:8px 0 3px;font-size:25px;text-shadow:0 2px 4px #0008}
.hero p{margin:0;font-size:14px;text-shadow:0 1px 3px #0008}

header{
    background:#087f5b;color:white;text-align:center;padding:10px;
    position:sticky;top:0;z-index:100;
}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px}

.search-box{padding:12px;background:white;position:sticky;top:63px;z-index:90}
#search{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}

.container{max-width:1100px;margin:auto;padding:15px}
.section-title{text-align:center;margin:15px 0;font-size:22px}

.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.category-card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 10px #0002;cursor:pointer;transition:.2s}
.category-card:hover{transform:translateY(-3px)}
.category-card img{width:100%;height:145px;object-fit:cover;display:block}
.category-name{text-align:center;padding:12px 5px;font-size:18px;font-weight:bold}

.products-section{display:none}
.back-btn{background:#555;color:white;border:0;padding:10px 16px;border-radius:8px;font-size:15px;cursor:pointer;margin-bottom:12px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product{background:white;border-radius:13px;overflow:hidden;box-shadow:0 3px 10px #0002}
.product img{width:100%;height:130px;object-fit:cover;display:block}
.product-info{padding:10px}
.product-name{font-weight:bold;font-size:16px;min-height:38px}
.price{color:#087f5b;font-weight:bold;font-size:17px;margin:5px 0}
.qty{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:8px}
.qty button{width:38px;height:38px;border:0;border-radius:8px;background:#087f5b;color:white;font-size:23px;cursor:pointer}
.qty span{font-size:18px;font-weight:bold;min-width:25px;text-align:center}

.cart{background:white;margin-top:20px;border-radius:15px;padding:15px;box-shadow:0 3px 10px #0002}
.cart h2{margin-top:0}
.cart-item{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:9px 0;gap:8px}
.total{font-size:21px;font-weight:bold;text-align:right;margin-top:12px;color:#087f5b}
.customer{margin-top:15px}
.customer input,.customer textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
.customer textarea{height:80px;resize:none}
.order-btn{width:100%;padding:14px;border:0;border-radius:10px;background:#25D366;color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:8px}
.clear-btn{width:100%;padding:11px;border:0;border-radius:10px;background:#dc3545;color:white;font-size:15px;cursor:pointer;margin-top:8px}
.empty{text-align:center;color:#777;padding:20px}

@media(min-width:700px){
    .categories{grid-template-columns:repeat(4,1fr)}
    .products{grid-template-columns:repeat(4,1fr)}
    .hero{height:330px}
}
</style>
</head>
